server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;
    gzip_comp_level 6;

    # SPA: todas las rutas sirven index.html (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache de larga duración para assets con hash en el nombre (Vite los genera así)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Sin cache para index.html (siempre debe ser fresco)
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
